{{ define "main" }}
  <header class="page-hero shell narrow-shell">
    <p class="kicker">{{ .Section | default .Type }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
    {{ with .Content }}<div class="prose intro-prose">{{ . }}</div>{{ end }}
  </header>
  <section class="section shell">
    <div class="content-grid">
      {{ range .Pages.ByDate.Reverse }}{{ partial "content-card.html" . }}{{ else }}
        <p class="empty-state">{{ i18n "nothing_published" }}</p>
      {{ end }}
    </div>
  </section>
{{ end }}

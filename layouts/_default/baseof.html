<!doctype html>
<html lang="{{ site.Language.Locale }}" data-theme="light">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="page-{{ .Kind }}{{ with .Section }} section-{{ . }}{{ end }}">
    <a class="skip-link" href="#main-content">{{ i18n "skip_to_content" }}</a>
    {{ partial "header.html" . }}
    <main id="main-content">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ with resources.Get "js/site.js" }}
      {{ $script := . | minify | fingerprint }}
      <script src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" defer></script>
    {{ end }}
  </body>
</html>

{{- $id := .Get 0 -}}
{{- $title := .Get "title" | default "Vimeo video" -}}
<div class="video-embed">
  <iframe src="https://player.vimeo.com/video/{{ $id }}?dnt=1" title="{{ $title }}" loading="lazy" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</div>

baseURL = "https://rtl.no/"
title = "Rune T. Larsen"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
enableRobotsTXT = true
enableGitInfo = false
timeZone = "Europe/Oslo"

[frontmatter]
  date = ["date", "publishDate", "lastmod"]
  lastmod = ["lastmod", ":git", "date"]

[permalinks]
  articles = "/articles/:year/:slug/"
  notes = "/notes/:year/:month/:slug/"

[taxonomies]
  tag = "tags"
  category = "categories"
  artist = "artists"
  project = "project-tags"

[outputs]
  home = ["HTML", "RSS", "SearchIndex"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "searchindex"
  isPlainText = true
  notAlternative = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  author = "Rune T. Larsen"
  github = "https://github.com/TheTechArch"
  evkx = "https://evkx.net"
  description = "Rune T. Larsen is a Technology Architect and developer writing about technology, software, AI, electric vehicles, web projects and music."
  socialDescription = "Building websites since 1996. Still curious about how technology works."

[languages]

          link_label: "Plan the visit"
        - title: "Alexanderplatz and the World Clock"
          location: "Mitte"
          text: "The World Clock at Alexanderplatz is a specific stop on the way east through the city. From here it is easy to continue to the East Side Gallery."
          url: "https://www.visitberlin.de/en/alexanderplatz"
          link_label: "Alexanderplatz"
        - title: "Urban Outfitters"

        - title: "One BVG ticket for the family"
          location: "24 hours · Berlin AB · up to 5 people"
          text: "Buy one 24-hour small-group ticket in the BVG Ticket or Fahrinfo app. Only one adult needs the app, but the phone holding the ticket must stay with the group and have enough battery. Activate the mobile ticket before the first journey; a paper ticket from a machine must be validated. The ticket covers U-Bahn, S-Bahn, buses and trams."
          url: "https://www.bvg.de/en/subscriptions-and-tickets/all-tickets/24h-tickets/24h-small-group-ticket"
          link_label: "BVG · 24-hour small-group ticket"

days:
  - number: 1
    stop_index: 1
    tone: coast
    distance: "Ca. 750–800 km"
    drive_no: "8–9 t ren · 9,5–11 t med pauser"
    drive_en: "8–9 hrs driving · 9.5–11 hrs with breaks"
    image:
      url: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/01/%C3%98resund_Bridge_from_the_air_in_September_2015.jpg/1280px-%C3%98resund_Bridge_from_the_air_in_September_2015.jpg"
      credit: "Nick-D"
      license: "CC BY-SA 4.0"
      source: "https://commons.wikimedia.org/wiki/File:%C3%98resund_Bridge_from_the_air_in_September_2015.jpg"
    routes:
      - label_no: "Oslo → Odense"
        label_en: "Oslo → Odense"
        via_no: "Via Göteborg, Malmö og København"
        via_en: "Via Gothenburg, Malmö and Copenhagen"
        url: "https://www.google.com/maps/dir/?api=1&origin=Oslo%2C+Norway&destination=Odense%2C+Denmark&travelmode=driving&avoid=ferries&waypoints=Gothenburg%2C+Sweden%7CMalmo%2C+Sweden%7CCopenhagen%2C+Denmark"
    no:
      short_title: "Broene sørover"
      eyebrow: "Transportetappe · Skandinavia"
      from: "Oslo"
      to: "Odense"
      status: "Fast hovedrute"
      day_type: "Lang kjøredag"
      summary: "Første dag setter rytmen: E6 gjennom Sverige, Øresundsbroen, København og Storebælt før en rolig hotellkveld i Odense."
      plan_title: "En effektiv start uten ferge"
      plan_intro: "Kjøringen er dagens hovedoppgave. Vi stopper etter pausebehov og bruker broene som både transport og de første tydelige opplevelsene på turen."
      steps:
        - "Tidlig start fra Oslo og første naturlige pause i Göteborg-området."
        - "Videre via Malmö og Øresundsbroen; trafikkstatus sjekkes før København."
        - "Kryss Storebælt og avslutt på hotell med enkel adkomst fra E20 og trygg parkering."
      sights:
        - title: "Göteborg"
          location: "Sverige · pausekandidat"
          text: "En naturlig første lengre pause. Velg et stopp nær E6 hvis målet er fremdrift, eller sentrum hvis dagen har god margin."
          url: "https://www.goteborg.com/en"
          link_label: "Offisiell byguide"
        - title: "Øresundsbroen"
          location: "Malmö → København"
          text: "Den ikoniske bro- og tunnelforbindelsen markerer overgangen fra Sverige til Danmark. Sjekk vind og trafikk før passering."
          url: "https://www.oresundsbron.com/en/traffic-information"
          link_label: "Trafikkstatus"
        - title: "Storebælt"
          location: "Sjælland → Fyn"
          text: "Dagens andre store broopplevelse og siste tydelige milepæl før Odense."
          url: "https://storebaelt.dk/en/"
          link_label: "Offisiell informasjon"
    en:
      short_title: "Bridges south"
      eyebrow: "Transit stage · Scandinavia"
      from: "Oslo"
      to: "Odense"
      status: "Fixed main route"
      day_type: "Long driving day"
      summary: "The opening day sets the rhythm: E6 through Sweden, the Øresund link, Copenhagen and the Great Belt before a quiet hotel evening in Odense."
      plan_title: "An efficient ferry-free start"
      plan_intro: "Driving is the main task. Stops follow natural break needs, while the bridges become both transport and the first distinctive experiences of the trip."
      steps:
        - "Leave Oslo early and take the first substantial break around Gothenburg."
        - "Continue through Malmö and across Øresund; check traffic before Copenhagen."
        - "Cross the Great Belt and finish at a hotel with easy E20 access and secure parking."
      sights:
        - title: "Gothenburg"
          location: "Sweden · break candidate"
          text: "A natural first longer break. Stay near E6 for progress, or enter the centre if the day has a comfortable margin."
          url: "https://www.goteborg.com/en"
          link_label: "Official city guide"
        - title: "Øresund Bridge"
          location: "Malmö → Copenhagen"
          text: "The iconic bridge-and-tunnel link marks the move from Sweden to Denmark. Check wind and traffic before crossing."
          url: "https://www.oresundsbron.com/en/traffic-information"
          link_label: "Traffic status"
        - title: "Great Belt"
          location: "Zealand → Funen"
          text: "The second major bridge experience of the day and the final clear milestone before Odense."
          url: "https://storebaelt.dk/en/"
          link_label: "Official information"


      summary: "A full day without driving creates room for Berlin's history, architecture, Malin's shops and neighbourhoods without turning the programme into a sprint."
      plan_title: "One coherent route through the city"
      plan_intro: "The car stays in Hotel MOA's multi-storey car park, entered from Birkenstrasse 21. Bershka in the Mall of Berlin and Urban Outfitters near Alexanderplatz are woven into the route; the Reichstag requires advance registration if the dome is included."

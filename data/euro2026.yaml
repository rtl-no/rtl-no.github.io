      day_type: "Til fots og kollektivt"
      summary: "En hel dag uten kjøring gir plass til Berlins historie, arkitektur, mat og nabolag uten at programmet blir en sprint."
      plan_title: "Én sammenhengende rute gjennom byen"
      plan_intro: "Vi velger noen få hovedområder og kobler dem med U-Bahn eller S-Bahn. Reichstag krever forhåndsbestilling hvis kuppelen skal besøkes."

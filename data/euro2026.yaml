          link_label: "Berlin's top attractions"
        - title: "Bershka and the XXL slide"
          location: "Mall of Berlin · Leipziger Platz 12"
          text: "Malin's first shopping stop is on the first floor of the Mall of Berlin. The centre is also known for its large indoor tube slide; check that it is operating closer to the visit."

        url: "https://www.google.com/maps/dir/?api=1&origin=Odense%2C+Denmark&destination=Berlin%2C+Germany&travelmode=driving&avoid=ferries&waypoints=Kolding%2C+Denmark%7CFlensburg%2C+Germany%7CHamburg%2C+Germany"
    no:
      short_title: "Inn til Berlin"
      eyebrow: "Transportetappe · Danmark og Tyskland"
      from: "Odense"
      to: "Berlin"
      status: "Fast hovedrute"
      day_type: "Mellomlang kjøredag"
      summary: "E20 og A7/A24 fører fra Fyn via Kolding, Flensburg og Hamburg-korridoren til to netter i Berlin."
      plan_title: "Fremdrift med rom for gode pauser"
      plan_intro: "Dette er en enklere transportdag enn dag én. Målet er å være fremme tidsnok til innsjekk, middag og en rolig første kveld i Berlin."
      steps:
        - "Start etter frokost og bruk Kolding eller området før grensen som første pause."
        - "Velg Hamburg- eller Lübeck-korridoren etter trafikkbildet."
        - "Ankom Berlin før kveldsrushet hvis mulig, parker bilen og la den stå til dag fire."
      sights:
        - title: "Kolding"
          location: "Danmark · fleksibel pause"
          text: "Et enkelt stopp nær motorveien, eller en kort avstikker mot Koldinghus dersom tidsplanen tåler det."
          url: "https://www.visitkolding.dk/"
          link_label: "Visit Kolding"
        - title: "Flensburg"
          location: "Danmark → Tyskland"
          text: "Grensebyen er en naturlig markør for den tyske delen av turen og et mulig kaffe- eller ladestopp."
          url: "https://www.flensburger-foerde.de/en/"
          link_label: "Offisiell turistguide"
        - title: "Berlin ved ankomst"
          location: "Tyskland · kveld"
          text: "Etter parkering holder vi kvelden lokal: en rusletur og middag i området rundt hotellet."
          url: "https://www.visitberlin.de/en"
          link_label: "visitBerlin"
    en:
      short_title: "Into Berlin"
      eyebrow: "Transit stage · Denmark and Germany"
      from: "Odense"
      to: "Berlin"
      status: "Fixed main route"
      day_type: "Medium driving day"
      summary: "E20 and A7/A24 lead from Funen through Kolding, Flensburg and the Hamburg corridor to two nights in Berlin."
      plan_title: "Progress with room for proper breaks"
      plan_intro: "This is an easier transit day than day one. The aim is to arrive in time for check-in, dinner and a quiet first evening in Berlin."
      steps:
        - "Leave after breakfast and use Kolding or the area before the border as the first break."
        - "Choose the Hamburg or Lübeck corridor according to current traffic."
        - "Reach Berlin before the evening rush if possible, park the car and leave it until day four."
      sights:
        - title: "Kolding"
          location: "Denmark · flexible break"
          text: "An easy motorway stop, or a short detour towards Koldinghus if the schedule allows it."
          url: "https://www.visitkolding.dk/"
          link_label: "Visit Kolding"
        - title: "Flensburg"
          location: "Denmark → Germany"
          text: "The border city is a natural marker for the German part of the drive and a possible coffee or charging stop."
          url: "https://www.flensburger-foerde.de/en/"
          link_label: "Official visitor guide"
        - title: "Berlin on arrival"
          location: "Germany · evening"
          text: "Once parked, keep the evening local with a short walk and dinner around the hotel."
          url: "https://www.visitberlin.de/en"
          link_label: "visitBerlin"


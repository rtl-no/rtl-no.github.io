    en:
      short_title: "Monster drive home"
      eyebrow: "07:00 departure · Netherlands, Germany, Denmark, Sweden and Norway"
      from: "Amsterdam"
      to: "Oslo"
      status: "Planned direct return · safety stop if needed"
      day_type: "Very long ferry-free driving day"
      summary: "Leave Amsterdam at 07:00 and drive directly home through Hamburg, Denmark, the bridges and Gothenburg. Pick up the dog from family roughly one hour before Oslo."
      plan_title: "Early start, driver changes and a genuine exit plan"
      plan_intro: "The actual first-day pace was 766 km in 7 hrs 56 min. The same pace gives about 15–16 hours of pure progress, but charging, meals, traffic and dog pickup make 17–19 hours more realistic."
      steps:
        - "Leave Amsterdam precisely at 07:00 with the car packed and a high battery level."
        - "Change drivers regularly and combine rapid charging, toilets and meals into as few—but proper—breaks as possible."
        - "Follow Hamburg, Kolding, the Great Belt, Copenhagen and Øresund without city detours."
        - "Make a clear status decision in Gothenburg. If fatigue is significant, use a hotel as the safety valve even though the main plan is to continue."
        - "Pick up the dog from his dog sister, at the girlfriend's sister's home, roughly one hour before Oslo."
        - "Expect a late-evening dog pickup and arrival in Oslo around 00:00–02:00, depending on traffic and breaks."

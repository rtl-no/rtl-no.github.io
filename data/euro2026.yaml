    en:
      short_title: "Cannes and Antibes Old Town"
      eyebrow: "Second full day in France · Thursday 30 July"
      from: "Hôtel Le Collier"
      to: "Hôtel Le Collier"
      status: "Hotel base booked · car stays parked"
      day_type: "Cannes by TER · Antibes on foot"
      summary: "A short morning train to Cannes leaves time for the market, Le Suquet and the Croisette before an afternoon in Antibes Old Town, the Picasso Museum and Port Vauban."
      plan_title: "Cannes before lunch, Antibes afterwards"
      plan_intro: "The TER between Antibes and Cannes normally takes about 10–15 minutes. Start early enough to experience Marché Forville while the market is still active."
      steps:
        - "08:30–09:15: Walk to Antibes station and take the TER to Cannes."
        - "09:15–10:15: Start at Marché Forville and pick up fruit, pastries or snacks for the day."
        - "10:15–11:30: Walk through Le Suquet to the viewpoint by the church, then descend towards the Old Port."
        - "11:30–13:00: See Palais des Festivals, the celebrity handprints and walk part of La Croisette."
        - "13:00–14:00: Have lunch in Cannes, or return by train and eat in Antibes."
        - "14:00–16:30: Explore the Marché Provençal area, narrow lanes and ramparts of Antibes Old Town. Add the Picasso Museum if art appeals."
        - "16:30–18:00: Follow the ramparts to Port Vauban and the Nomade sculpture. The hotel is conveniently placed for a break afterwards."

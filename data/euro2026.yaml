  - number: 10
    weekday_no: "Onsdag"
    weekday_en: "Wednesday"
    stop_index: 9
    tone: coast
    distance: "Tog og gange · ca. 15–18 km til fots"
    drive_no: "Bilen står i hotellgarasjen"
    drive_en: "The car stays in the hotel garage"
    image:
      url: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Monaco_Panorama_2015.jpg/1280px-Monaco_Panorama_2015.jpg"
      credit: "Villy Fink Isaksen"
      license: "CC BY-SA 4.0"
      source: "https://commons.wikimedia.org/wiki/File:Monaco_Panorama_2015.jpg"
    routes:
      - label_no: "Antibes → Monaco → Nice → Antibes"
        label_en: "Antibes → Monaco → Nice → Antibes"
        via_no: "Direkte TER til Monaco · stopp i Nice på returen"
        via_en: "Direct TER to Monaco · stop in Nice on the return"
        url: "https://www.sncf-connect.com/en-en/train/timetables/antibes/monaco"
    no:
      short_title: "Monaco og Nice med tog"
      eyebrow: "Første hele Frankrike-dag · onsdag 29. juli"
      from: "Hôtel Le Collier"
      to: "Hôtel Le Collier"
      status: "Hotell og base bestilt · bilen står"
      day_type: "Direkte TER · Monaco morgen · Nice ettermiddag"
      summary: "Gå til Antibes stasjon, ta direkte TER til Monaco og stopp i Nice på returen. Dette unngår kø, parkering og krevende bykjøring."
      plan_title: "Anbefalt rundtur: Monaco-Ville → havnen → Formel 1-runden"
      plan_intro: "Kjøp billetter i SNCF Connect eller på stasjonen. Ta et direkte tog rundt kl. 08:00–08:30. Monaco-stasjonen ligger inne i fjellet og har flere utganger: følg skiltene mot Fontvieille / Le Rocher ved ankomst og Monte-Carlo / Pont Sainte-Dévote når dere skal tilbake."
      steps:
        - "07:45–08:30: Gå fra Hôtel Le Collier til Antibes stasjon og ta direkte TER til Monaco–Monte-Carlo. Turen tar normalt rundt 50–55 minutter."
        - "Ca. 09:20: Inne på stasjonen følger dere skiltene mot Fontvieille / Le Rocher. Bruk heisene og gå via Place d’Armes og Rampe Major opp til Monaco-Ville. Regn med 15–25 minutter. Buss 1 eller 2 mot Monaco-Ville er reserve hvis dere vil spare beina."
        - "09:45–11:45: Gå den kompakte runden Place du Palais → utsikten over Port Hercule → smugene i gamlebyen → katedralen → Saint-Martin-hagene. Vær tilbake på palassplassen før vaktskiftet kl. 11:55."
        - "12:00–14:00: Velg ett hovedbesøk: Fyrstepalassets statsrom eller Oceanografisk museum. Museet er det beste familievalget og krever omtrent to timer."
        - "14:00–14:40: Spis en enkel lunsj i Monaco-Ville. Følg deretter skiltene og de offentlige heisene ned mot Port Hercule."
        - "14:40–16:10: Anbefalt Formel 1-runde til fots: start-/målområdet ved Boulevard Albert I → Sainte-Dévote → opp Avenue d’Ostende → Casino-plassen → Fairmont-hårnålen → tunnelinngangen → tilbake langs havnen. En 14-åring kan se kasinoets atrium, men ikke spilleområdene."
        - "Ca. 16:10: Følg skiltene mot Monaco-Monte-Carlo-stasjonen og utgangen Monte-Carlo / Pont Sainte-Dévote. Legg inn minst 15 minutter til plattformen og ta TER videre til Nice-Ville rundt kl. 16:30."
        - "17:00–19:00: Gå Avenue Jean Médecin → Place Masséna → gamle Nice og Cours Saleya. Hvis dere holder tempoet, ta heisen eller trappene til Slottsåsen for utsikt over Baie des Anges før Promenade des Anglais. Parken stenger kl. 20:00."
        - "Ca. 19:00: Reis fra Nice-Ville til Saint-Laurent-du-Var og gå under fem minutter til CAP3000."
        - "19:20–20:15: Fast stopp for Malin hos Urban Outfitters i CAP3000, Avenue Eugène Donadeï, 06700 Saint-Laurent-du-Var."
        - "Etter butikkstoppet: Ta TER fra Saint-Laurent-du-Var tilbake til Antibes og gå til hotellet. Kontroller siste praktiske avgang i SNCF Connect."
      sights:
        - title: "Monaco-Ville og Fyrstepalasset"
          location: "Monaco"
          text: "Gamlebyen, palassplassen og utsikten over Port Hercule er kjernen i besøket. Statsrommene er åpne i sommersesongen."
          url: "https://palaisprinciermonaco.tickeasy.com/en-GB/home"
          link_label: "Billetter og åpningstider"
        - title: "Oceanografisk museum"
          location: "Monaco-Ville"
          text: "Akvarier, havhistorie og takterrasse gjør dette til dagens sterkeste aktivitet for både voksne og en 14-åring."
          url: "https://musee.oceano.org/en/practical-info/"
          link_label: "Praktisk informasjon"
        - title: "Casino-plassen"
          location: "Monte-Carlo"
          text: "Se Casino de Monte-Carlo, Hôtel de Paris og bilene på plassen. Mindreårige kan besøke atriet, men ikke spilleområdene."
          url: "https://www.montecarlosbm.com/en/casino/game/prices-and-conditions-entry"
          link_label: "Adgangsregler"
        - title: "Formel 1-ruten i Monaco"
          location: "Sainte-Dévote → Casino → Fairmont-hårnålen → tunnelen"
          text: "Flere av de mest kjente delene av Monaco Grand Prix-banen ligger direkte mellom Port Hercule og Casino-plassen og kan tas til fots uten en egen omvei."
          url: "https://www.visitmonaco.com/en/routes-and-walks/27551/getaway-with-friends"
          link_label: "Visit Monaco"
        - title: "Gamle Nice og Promenade des Anglais"
          location: "Nice"
          text: "Place Masséna, Cours Saleya, gamlebyen og strandpromenaden gir en kompakt og stemningsfull ettermiddag."
          url: "https://www.explorenicecotedazur.com/en/"
          link_label: "Explore Nice"
        - title: "Slottsåsen · Colline du Château"
          location: "Mellom gamlebyen og havnen · gratis"
          text: "Dagens beste utsikt over Baie des Anges, gamle Nice og havnen. Bruk heisen hvis tiden er knapp; sommeråpningen er til kl. 20:00."
          url: "https://www.explorenicecotedazur.com/en/culture/parc-de-la-colline-du-chateau/"
          link_label: "Praktisk informasjon"
        - title: "Urban Outfitters · CAP3000"
          location: "Avenue Eugène Donadeï · 06700 Saint-Laurent-du-Var"
          text: "Malin vil tilbake hit. Ta TER fra Nice-Ville til Saint-Laurent-du-Var; kjøpesenteret ligger under fem minutters gange fra stasjonen."
          url: "https://www.urbanoutfitters.com/stores/nice"
          link_label: "Offisiell butikkside"
    en:
      short_title: "Monaco and Nice by train"
      eyebrow: "First full day in France · Wednesday 29 July"
      from: "Hôtel Le Collier"
      to: "Hôtel Le Collier"
      status: "Hotel base booked · car stays parked"
      day_type: "Direct TER · Monaco morning · Nice afternoon"
      summary: "Walk to Antibes station, take a direct TER to Monaco and stop in Nice on the return. This avoids congestion, parking and difficult city driving."
      plan_title: "Recommended circuit: Monaco-Ville → harbour → Formula 1 route"
      plan_intro: "Buy tickets in SNCF Connect or at the station. Take a direct train at about 08:00–08:30. Monaco station sits inside the rock and has several exits: follow signs for Fontvieille / Le Rocher on arrival and Monte-Carlo / Pont Sainte-Dévote when returning."
      steps:
        - "07:45–08:30: Walk from Hôtel Le Collier to Antibes station and take a direct TER to Monaco–Monte-Carlo. The journey normally takes about 50–55 minutes."
        - "Around 09:20: Inside the station, follow signs for Fontvieille / Le Rocher. Use the lifts and walk via Place d’Armes and Rampe Major to Monaco-Ville. Allow 15–25 minutes. Bus 1 or 2 towards Monaco-Ville is the fallback if you want to save your legs."
        - "09:45–11:45: Walk the compact circuit Place du Palais → Port Hercule viewpoint → Old Town lanes → cathedral → Saint Martin Gardens. Return to the palace square before the changing of the guard at 11:55."
        - "12:00–14:00: Choose one main visit: the Prince's Palace State Apartments or the Oceanographic Museum. The museum is the strongest family choice and needs about two hours."
        - "14:00–14:40: Have a simple lunch in Monaco-Ville, then follow signs and the public lifts down towards Port Hercule."
        - "14:40–16:10: Recommended Formula 1 circuit on foot: start/finish area on Boulevard Albert I → Sainte-Dévote → up Avenue d’Ostende → Casino Square → Fairmont Hairpin → tunnel entrance → back along the harbour. A 14-year-old may see the casino atrium but not the gaming areas."
        - "Around 16:10: Follow signs for Monaco-Monte-Carlo station and the Monte-Carlo / Pont Sainte-Dévote entrance. Allow at least 15 minutes to reach the platform and take the TER to Nice-Ville at about 16:30."
        - "17:00–19:00: Walk Avenue Jean Médecin → Place Masséna → Vieux Nice and Cours Saleya. If the pace allows, use the lift or steps to Castle Hill for views over the Baie des Anges before Promenade des Anglais. The park closes at 20:00."
        - "Around 19:00: Travel from Nice-Ville to Saint-Laurent-du-Var and walk less than five minutes to CAP3000."
        - "19:20–20:15: Fixed stop for Malin at Urban Outfitters in CAP3000, Avenue Eugène Donadeï, 06700 Saint-Laurent-du-Var."
        - "After shopping: Take the TER from Saint-Laurent-du-Var back to Antibes and walk to the hotel. Confirm the final practical departure in SNCF Connect."
      sights:
        - title: "Monaco-Ville and the Prince's Palace"
          location: "Monaco"
          text: "The Old Town, palace square and views over Port Hercule form the heart of the visit. The State Apartments are open during the summer season."
          url: "https://palaisprinciermonaco.tickeasy.com/en-GB/home"
          link_label: "Tickets and opening hours"
        - title: "Oceanographic Museum"
          location: "Monaco-Ville"
          text: "Aquariums, maritime history and a rooftop terrace make this the day's strongest activity for adults and a 14-year-old alike."
          url: "https://musee.oceano.org/en/practical-info/"
          link_label: "Practical information"
        - title: "Casino Square"
          location: "Monte-Carlo"
          text: "See the Casino de Monte-Carlo, Hôtel de Paris and the cars around the square. Minors may visit the atrium but not the gaming rooms."
          url: "https://www.montecarlosbm.com/en/casino/game/prices-and-conditions-entry"
          link_label: "Entry conditions"
        - title: "Monaco Formula 1 circuit"
          location: "Sainte-Dévote → Casino → Fairmont Hairpin → tunnel"
          text: "Several of the Monaco Grand Prix circuit's most famous sections lie directly between Port Hercule and Casino Square and can be covered on foot without a separate detour."
          url: "https://www.visitmonaco.com/en/routes-and-walks/27551/getaway-with-friends"
          link_label: "Visit Monaco"
        - title: "Vieux Nice and Promenade des Anglais"
          location: "Nice"
          text: "Place Masséna, Cours Saleya, the Old Town and seafront create a compact, atmospheric afternoon."
          url: "https://www.explorenicecotedazur.com/en/"
          link_label: "Explore Nice"
        - title: "Castle Hill · Colline du Château"
          location: "Between the Old Town and port · free"
          text: "The day's best view over the Baie des Anges, Vieux Nice and the harbour. Use the lift if time is short; summer opening runs until 20:00."
          url: "https://www.explorenicecotedazur.com/en/culture/parc-de-la-colline-du-chateau/"
          link_label: "Practical information"
        - title: "Urban Outfitters · CAP3000"
          location: "Avenue Eugène Donadeï · 06700 Saint-Laurent-du-Var"
          text: "Malin wants to return here. Take the TER from Nice-Ville to Saint-Laurent-du-Var; the shopping centre is less than a five-minute walk from the station."
          url: "https://www.urbanoutfitters.com/stores/nice"
          link_label: "Official store page"


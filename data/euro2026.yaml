      short_title: "Verona sentrum"
      eyebrow: "Shuttle 11:00–17:15 · rolig bydag"
      from: "Crowne Plaza Verona Fiera"
      to: "Samme hotell"
      status: "Shuttle bestilt · avreise 11:00 · retur 17:15"
      day_type: "Verona til fots · valgfri Gardasjø-kveld"
      summary: "Shuttle fra Crowne Plaza kl. 11:00 gir omtrent fem timer i Verona sentrum før henting kl. 17:15. Mandagsplanen prioriterer Arenaen utvendig, historiske plasser, Castelvecchio-broen og Ponte Pietra."
      plan_title: "En sammenhengende byrunde med god tidsmargin"
      plan_intro: "Flere museer er stengt mandag, så dagen fungerer best som en rolig utendørs vandring. Planlegg å være tilbake ved shuttle-stoppet senest kl. 16:55."
      steps:
        - "11:15–12:00: Start på Piazza Bra og se Arena di Verona utvendig. Gå deretter til Castelvecchio og over Ponte Scaligero."
        - "12:00–13:00: Følg sentrumsgatene tilbake og ta lunsj mellom Piazza Bra og Piazza delle Erbe."
        - "13:00–15:15: Gå Via Mazzini, se Julies hus utvendig hvis adkomsten er åpen, og fortsett gjennom Piazza delle Erbe, Piazza dei Signori og Scaliger-gravene."
        - "15:15–16:10: Fortsett til Ponte Pietra for utsikten over Adige. Snu her; ikke legg inn den bratte turen til Castel San Pietro i dag."
        - "16:10–16:55: Gå rolig tilbake mot shuttle-stoppet, kjøp gelato underveis og vær på plass minst 20 minutter før avgang."
        - "Etter hotellet: Hvis alle fortsatt har energi, kjør til Lazise for gamlebyen, havnen, middag og solnedgang. Parker utenfor ZTL, for eksempel ved Parcheggio Marra."
      sights:
        - title: "Piazza Bra og Arenaen"
          location: "Start og avslutning"
          text: "Veronas store møteplass og byens romerske symbol. Mandag holder det fint å oppleve Arenaen fra utsiden."
          url: "https://www.visitverona.it/en/poi/piazza-bra"
          link_label: "Offisiell besøksinfo"
        - title: "Castelvecchio og Ponte Scaligero"
          location: "Kort gange fra Piazza Bra"
          text: "Den karakteristiske middelalderbroen gir en flott og gratis utsikt over Adige, selv når museet er stengt."
          url: "https://www.visitverona.it/en/poi/i-ponti-di-verona"
          link_label: "Veronas broer"
        - title: "Piazza delle Erbe og Piazza dei Signori"
          location: "Historisk sentrum"
          text: "Byens vakreste sammenhengende byrom, med marked, palasser og Scaliger-gravene like ved."
          url: "https://www.visitverona.it/en/poi/piazza-delle-erbe"
          link_label: "Offisiell besøksinfo"
        - title: "Ponte Pietra"
          location: "Nordenden av byrunden"
          text: "Den romerske broen er et naturlig vendepunkt med fin utsikt langs elven."
          url: "https://www.visitverona.it/en/poi/i-ponti-di-verona"
          link_label: "Veronas broer"
        - title: "Lazise ved Gardasjøen"
          location: "Valgfri kveldstur"
          text: "Et mer realistisk kveldsvalg enn Sirmione: gå gjennom middelalderporten til Porto Vecchio, spis middag og følg strandpromenaden ved solnedgang."
          url: "https://www.tourismlazise.it/en/city-of-lazise/"
          link_label: "Offisiell besøksinfo"
    en:
      short_title: "Verona city centre"
      eyebrow: "Shuttle 11:00–17:15 · relaxed city day"
      from: "Crowne Plaza Verona Fiera"
      to: "Same hotel"
      status: "Shuttle booked · departure 11:00 · return 17:15"
      day_type: "Verona on foot · optional Lake Garda evening"
      summary: "The 11:00 shuttle from Crowne Plaza gives roughly five hours in central Verona before the 17:15 pickup. Monday's plan prioritises the Arena exterior, historic squares, Castelvecchio Bridge and Ponte Pietra."
      plan_title: "One coherent city walk with a comfortable time buffer"
      plan_intro: "Several museums close on Mondays, so today works best as a relaxed outdoor walk. Be back at the shuttle stop no later than 16:55."
      steps:
        - "11:15–12:00: Start at Piazza Bra and see the Arena exterior, then walk to Castelvecchio and cross Ponte Scaligero."
        - "12:00–13:00: Walk back through the centre and have lunch between Piazza Bra and Piazza delle Erbe."
        - "13:00–15:15: Follow Via Mazzini, see Juliet's House from outside if access is open, then continue through Piazza delle Erbe, Piazza dei Signori and the Scaliger Tombs."
        - "15:15–16:10: Continue to Ponte Pietra for views along the Adige. Turn around here rather than adding the steep climb to Castel San Pietro."
        - "16:10–16:55: Walk back towards the shuttle stop, stop for gelato and arrive at least 20 minutes early."
        - "After the hotel: If everyone still has energy, drive to Lazise for the Old Town, harbour, dinner and sunset. Park outside the ZTL, for example at Parcheggio Marra."
      sights:
        - title: "Piazza Bra and the Arena"
          location: "Start and finish"
          text: "Verona's grand meeting place and Roman landmark. On Monday, enjoying the Arena exterior fits the day well."
          url: "https://www.visitverona.it/en/poi/piazza-bra"
          link_label: "Official visitor information"
        - title: "Castelvecchio and Ponte Scaligero"
          location: "Short walk from Piazza Bra"
          text: "The distinctive medieval bridge gives a beautiful free view over the Adige even while the museum is closed."
          url: "https://www.visitverona.it/en/poi/i-ponti-di-verona"
          link_label: "Verona's bridges"
        - title: "Piazza delle Erbe and Piazza dei Signori"
          location: "Historic centre"
          text: "The city's finest connected public spaces, with the market, palaces and Scaliger Tombs close together."
          url: "https://www.visitverona.it/en/poi/piazza-delle-erbe"
          link_label: "Official visitor information"
        - title: "Ponte Pietra"
          location: "Northern end of the walk"
          text: "The Roman bridge is a natural turnaround point with lovely views along the river."
          url: "https://www.visitverona.it/en/poi/i-ponti-di-verona"
          link_label: "Verona's bridges"
        - title: "Lazise on Lake Garda"
          location: "Optional evening drive"
          text: "A more realistic evening option than Sirmione: walk through the medieval gate to Porto Vecchio, have dinner and enjoy the lakeside promenade at sunset."
          url: "https://www.tourismlazise.it/en/city-of-lazise/"
          link_label: "Official visitor information"


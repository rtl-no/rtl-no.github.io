      short_title: "Timmelsjoch til Bolzano"
      eyebrow: "Lang fjellpassdag · Tyskland til Italia"
      from: "Ingolstadt"
      to: "Bolzano"
      status: "Hovedrute · vær- og tidsavhengig"
      day_type: "Lang panoramisk kjøredag"
      summary: "Sölden-natten er fjernet. En svært tidlig start gjør Timmelsjoch til hovedruten direkte fra Ingolstadt til Bolzano, mens Brenner ligger klar som raskere backup."
      plan_title: "Timmelsjoch beholdes – Bolzano korter ned dagen"
      plan_intro: "Dette blir turens lengste fjelldag, men Bolzano ligger tidligere enn Selva. Passet er normalt åpent 07–20 i sesongen; offisiell status, vær, trafikk og fremdrift avgjør om hovedruten er forsvarlig. Innsbruck blir gjennomkjøring, ikke bystopp."
      steps:
        - "Forlat Ingolstadt svært tidlig, lad effektivt ved Kiefersfelden og kjør videre uten et lengre stopp i Innsbruck."
        - "Bekreft Timmelsjoch-status før Ötztal. Velg Brenner straks dersom passet er stengt, været er dårlig eller tidsmarginen blir for liten."
        - "På hovedruten fortsetter vi via Sölden, Timmelsjoch og Merano til det bestilte Hotel Raffl i Laives sør for Bolzano. Innsjekking er senest 21:30."
      sights:
        - title: "Timmelsjoch Hochalpenstraße"
          location: "2 509 moh. · dagens hovedopplevelse"
          text: "Hårnåler, høyfjellslandskap og arkitektoniske stopp gjør passeringen til grunnen for å velge den lange ruten. Fotostoppene må likevel holdes fokuserte."
          url: "https://www.timmelsjoch.com/en"
          link_label: "Åpning og status"
        - title: "Merano"
          location: "Sør-Tyrol · kort pausekandidat"
          text: "Det mildere landskapet markerer overgangen fra høyfjellet. Stopp bare dersom fremdriften mot Bolzano fortsatt er god."
          url: "https://www.merano-suedtirol.it/en/merano.html"
          link_label: "Offisiell guide"
        - title: "Brenner-backup"
          location: "Innsbruck → Brenner → Bolzano"
          text: "Den kortere og mer forutsigbare ruten brukes ved stengt pass, dårlig vær, kø eller for sen fremdrift. Den sparer flere timer og ender på samme hotell i Bolzano."
          url: "https://www.valgardena.it/en/holidays-dolomites/arrival/by-car/"
          link_label: "Ruteinformasjon"
        - title: "Hotel Raffl"
          location: "Laives · bestilt overnatting"
          text: "Hotellet på St.-Jakob-Str. 218 er bestilt for én natt, med innsjekking 15:00–21:30. Beliggenheten sør for Bolzano gir en praktisk avslutning på den lange passdagen."
          url: "https://www.booking.com/hotel/it/raffl.no.html"
          link_label: "Se bookingen"
    en:
      short_title: "Timmelsjoch to Bolzano"
      eyebrow: "Long mountain-pass day · Germany to Italy"
      from: "Ingolstadt"
      to: "Bolzano"
      status: "Main route · weather- and time-dependent"
      day_type: "Long panoramic driving day"
      summary: "The Sölden night is removed. A very early start keeps Timmelsjoch as the main route directly from Ingolstadt to Bolzano, with Brenner ready as the faster fallback."
      plan_title: "Keep Timmelsjoch – shorten the day at Bolzano"
      plan_intro: "This becomes the trip's longest mountain day, but Bolzano finishes earlier than Selva. The pass normally operates from 07:00 to 20:00 in season; official status, weather, traffic and progress decide whether the main route remains sensible. Innsbruck becomes a drive-through rather than a city stop."
      steps:
        - "Leave Ingolstadt very early, charge efficiently at Kiefersfelden and continue without a substantial Innsbruck stop."
        - "Confirm the Timmelsjoch status before entering Ötztal. Choose Brenner immediately if the pass is closed, the weather is poor or the time margin becomes too small."
        - "On the main route, continue through Sölden, Timmelsjoch and Merano to the booked Hotel Raffl in Laives, south of Bolzano. Check-in closes at 21:30."
      sights:
        - title: "Timmelsjoch High Alpine Road"
          location: "2,509 m · the day's main experience"
          text: "Hairpins, high-Alpine scenery and architectural stops make the crossing the reason to choose the long route. Photo stops still need to remain focused."
          url: "https://www.timmelsjoch.com/en"
          link_label: "Opening and status"
        - title: "Merano"
          location: "South Tyrol · short break candidate"
          text: "The milder landscape marks the transition from the high mountains. Stop only if progress towards Bolzano remains good."
          url: "https://www.merano-suedtirol.it/en/merano.html"
          link_label: "Official guide"
        - title: "Brenner fallback"
          location: "Innsbruck → Brenner → Bolzano"
          text: "Use the shorter, more predictable route if the pass is closed, weather is poor, traffic is heavy or progress is too slow. It saves several hours and ends at the same hotel in Bolzano."
          url: "https://www.valgardena.it/en/holidays-dolomites/arrival/by-car/"
          link_label: "Route information"
        - title: "Hotel Raffl"
          location: "Laives · booked overnight stay"
          text: "The hotel at St.-Jakob-Str. 218 is booked for one night, with check-in from 15:00 to 21:30. Its location south of Bolzano provides a practical finish to the long pass day."
          url: "https://www.booking.com/hotel/it/raffl.no.html"
          link_label: "View booking"


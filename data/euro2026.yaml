      short_title: "Berlin city day"
      eyebrow: "City day · Berlin"
      from: "Berlin"
      to: "Berlin"
      status: "Fixed city day"
      day_type: "Walking and public transport"
      summary: "A full day without driving creates room for Berlin's history, architecture, food and neighbourhoods without turning the programme into a sprint."
      plan_title: "One coherent route through the city"
      plan_intro: "Choose a few main areas and connect them by U-Bahn or S-Bahn. The Reichstag requires advance registration if the dome is included."
